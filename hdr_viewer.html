<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>HDR Converter Electron</title>
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      background: #0d0f17;
      color: #e8ecf2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    #toolbar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #151b26;
      padding: 8px 16px;
      border-bottom: 1px solid #222a3a;
      flex-shrink: 0;
    }

    #toolbar h1 {
      font-size: 16px;
      color: #8ab4f8;
      margin-right: 16px;
    }

    .btn {
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s;
    }

    .btn-primary {
      background: #2d7df6;
      color: #fff;
    }

    .btn-primary:hover {
      background: #3d8eff;
    }

    .btn-secondary {
      background: #1e2738;
      color: #c8d0dc;
      border: 1px solid #2f3a4f;
    }

    .btn-secondary:hover {
      background: #28344a;
    }

    #main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    #panel {
      width: 380px;
      min-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      background: #111720;
      border-right: 1px solid #1e2638;
      overflow-y: auto;
    }

    .section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .section-title {
      font-size: 11px;
      color: #6a7d9c;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    label {
      font-size: 12px;
      color: #889bb8;
    }

    input[type="text"],
    select {
      width: 100%;
      background: #0b1018;
      border: 1px solid #222c3e;
      color: #e0e6f0;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus,
    select:focus {
      border-color: #2d7df6;
    }

    input[type="text"]::placeholder {
      color: #4a5a74;
    }

    .path-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .path-row input {
      flex: 1;
    }

    .path-btn {
      background: #1a2333;
      border: 1px solid #2a364c;
      color: #8ab4f8;
      border-radius: 6px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .path-btn:hover {
      background: #243144;
      border-color: #3a4a66;
    }

    .range-row {
      display: grid;
      grid-template-columns: 1fr 48px;
      gap: 8px;
      align-items: center;
    }

    .range-row input[type="range"] {
      width: 100%;
      height: 4px;
      cursor: pointer;
      accent-color: #2d7df6;
    }

    .range-row span {
      color: #7d94b8;
      font-size: 12px;
      text-align: right;
    }

    .format-hint {
      font-size: 11px;
      color: #5a7a9a;
      margin-top: 2px;
    }

    .status-box {
      background: #0b1018;
      border: 1px solid #1e2638;
      border-radius: 8px;
      padding: 10px 12px;
      min-height: 60px;
      font-size: 13px;
      color: #b0c2d8;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-y: auto;
      max-height: 120px;
    }

    .backend-method {
      background: rgba(11, 16, 24, 0.72);
      border: 1px solid #2a364c;
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 12px;
      color: #8ab4f8;
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 0;
      max-width: 420px;
      white-space: nowrap;
      overflow: hidden;
    }

    .backend-method>span:last-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .backend-method .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4fc3f7;
      flex-shrink: 0;
    }

    .backend-method.ready .dot {
      background: #57d9a3;
    }

    .backend-method.error .dot {
      background: #f56a6a;
    }

    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .progress-bar {
      flex: 1;
      height: 8px;
      background: #1a2333;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2d7df6, #4fc3f7);
      border-radius: 4px;
      transition: width 0.2s ease;
    }

    .progress-label {
      font-size: 12px;
      color: #7d94b8;
      min-width: 42px;
      text-align: right;
    }

    #previewArea {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* 横向布局（默认）：左右并排 */
    #previewArea.layout-horizontal {
      flex-direction: row;
    }

    #previewArea.layout-horizontal .preview-pane+.preview-pane {
      border-left: 1px solid #1e2638;
      border-top: none;
    }

    /* 纵向布局（竖图）：上下排列 */
    #previewArea.layout-vertical {
      flex-direction: column;
    }

    #previewArea.layout-vertical .preview-pane+.preview-pane {
      border-top: 1px solid #1e2638;
      border-left: none;
    }

    .preview-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      min-width: 0;
      min-height: 0;
    }

    .preview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 14px;
      background: #131a24;
      border-bottom: 1px solid #1e2638;
      font-size: 12px;
      flex-shrink: 0;
    }

    .preview-header .label {
      color: #889bb8;
    }

    .badge-sdr {
      color: #f5b342;
      font-weight: 600;
    }

    .badge-hdr {
      color: #4fc3f7;
      font-weight: 600;
    }

    .preview-header .info {
      color: #5a7a9a;
      font-size: 11px;
    }

    .preview-viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0d14;
      background-image: radial-gradient(circle at 50% 50%, #121a26 0%, #080b10 100%);
      overflow: hidden;
      position: relative;
    }

    .preview-viewport img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
      transition: opacity 0.3s;
    }

    .preview-viewport .placeholder {
      color: #3d5068;
      text-align: center;
      font-size: 14px;
      max-width: 280px;
      line-height: 1.6;
    }

    .preview-viewport .placeholder .icon {
      font-size: 36px;
      margin-bottom: 8px;
    }

    /* 在纵向布局时隐藏分隔线，用边框代替 */
    #divider {
      width: 4px;
      cursor: col-resize;
      background: #1e2638;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    #divider:hover {
      background: #2d7df6;
    }

    #previewArea.layout-vertical+#divider,
    #previewArea.layout-vertical #divider {
      display: none;
    }

    /* 批量队列 */
    .batch-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .batch-list {
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid #2a2f45;
      border-radius: 8px;
      padding: 4px;
    }

    .batch-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 6px;
      border-radius: 6px;
      font-size: 12px;
    }

    .batch-item .b-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .batch-item .b-status {
      font-size: 11px;
      flex-shrink: 0;
    }

    .batch-item.queued {
      color: #8a94a6;
    }

    .batch-item.running {
      color: #2d7df6;
    }

    .batch-item.done {
      color: #3ddc84;
    }

    .batch-item.failed {
      color: #f14c4c;
    }

    .b-remove {
      background: none;
      border: none;
      color: #f56a6a;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      padding: 0 4px;
      flex-shrink: 0;
    }

    .b-remove:hover {
      color: #ff8a8a;
    }

    .btn-sm {
      padding: 4px 10px;
      font-size: 12px;
    }

    /* 选项卡 */
    #tabBar {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .tab-btn {
      flex: 1;
      min-width: 0;
      background: #1a2333;
      border: 1px solid #2a364c;
      color: #8a94a6;
      border-radius: 6px;
      padding: 6px 2px;
      cursor: pointer;
      font-size: 12px;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .tab-btn:hover {
      background: #243144;
      color: #c8d0dc;
    }

    .tab-btn.active {
      background: #2d7df6;
      border-color: #2d7df6;
      color: #fff;
    }

    .tab-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input[type="range"]:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div id="toolbar">
    <h1>HDR Converter</h1>
    <button class="btn btn-primary" id="btnChooseInput">📁 选择输入</button>
    <button class="btn btn-secondary" id="btnImportFolder">📂 导入文件夹</button>
    <button class="btn btn-secondary" id="btnConvert" disabled>▶ 开始转换</button>
    <span style="flex:1"></span>
    <div id="backendMethod" class="backend-method"><span class="dot"></span><span>检测中…</span></div>
    <span id="statusBar" style="font-size:12px;color:#5a7a9a;">就绪</span>
  </div>

  <div id="main">
    <div id="panel">
      <div id="tabBar">
        <button class="tab-btn active" data-tab="tabIO">输入输出</button>
        <button class="tab-btn" data-tab="tabQuality">参数质量</button>
        <button class="tab-btn" data-tab="tabQueue">转换队列</button>
      </div>

      <!-- 输入输出 -->
      <div class="tab-panel" id="tabIO">
        <div class="section">
          <div class="section-title">输入 / 输出</div>
          <label>输入图片路径</label>
          <div class="path-row">
            <input id="inputPath" type="text" placeholder="选择或粘贴图片路径...">
            <button class="path-btn" id="btnBrowseInput">浏览</button>
          </div>
          <label>输出文件路径</label>
          <div class="path-row">
            <input id="outputPath" type="text" placeholder="自动生成或手动输入...">
            <button class="path-btn" id="btnBrowseOutput">浏览</button>
          </div>
          <div class="format-hint" id="formatHint">输出格式将根据输入文件自动匹配</div>
        </div>
        <div class="section">
          <div class="section-title">输出格式</div>
          <label>导出格式</label>
          <select id="outputFormatSelect">
            <option value="auto">自动匹配（默认跟随源文件）</option>
            <option value="png">HDR PNG（iCCP + BT.2020）</option>
            <option value="jpg_icc">HDR JPEG（ICC 增益，BT.2020）</option>
            <option value="jpg">Ultra HDR JPEG（增益图 + ICC）</option>
          </select>
        </div>
      </div>

      <!-- 参数质量 -->
      <div class="tab-panel" id="tabQuality" style="display:none">
        <div class="section">
          <div class="section-title">参数调节</div>
          <label>HDR 强度</label>
          <div class="range-row"><input id="hdrIntensity" type="range" min="0.96" max="6.00" step="0.01"
              value="2.40"><span id="hdrIntensityValue">2.40</span></div>
          <label>微调明暗</label>
          <div class="range-row"><input id="fineTuneBrightness" type="range" min="0.3" max="1.5" step="0.01"
              value="0.3"><span id="fineTuneBrightnessValue">0.30</span></div>
          <label>伽马校正</label>
          <div class="range-row"><input id="gamma" type="range" min="0.3" max="3.0" step="0.01" value="0.9"><span
              id="gammaValue">0.90</span></div>
        </div>
        <div class="section" id="qualitySection" style="display:none;">
          <div class="section-title">JPEG 质量</div>
          <div class="range-row"><input id="jpgQuality" type="range" min="10" max="100" step="1" value="100"><span
              id="jpgQualityValue">100%</span></div>
          <div class="format-hint">仅对 jpg / jpg_icc 输出生效（拖拽时实时预览）</div>
        </div>
        <div class="section" id="rgbSection">
          <div class="section-title">高级参数 · RGB 通道</div>
          <label>红色通道</label>
          <div class="range-row"><input id="rgbRed" type="range" min="0.3" max="3.0" step="0.01" value="0.96"><span
              id="rgbRedValue">0.96</span></div>
          <label>绿色通道</label>
          <div class="range-row"><input id="rgbGreen" type="range" min="0.3" max="3.0" step="0.01" value="1.00"><span
              id="rgbGreenValue">1.00</span></div>
          <label>蓝色通道</label>
          <div class="range-row"><input id="rgbBlue" type="range" min="0.3" max="3.0" step="0.01" value="1.00"><span
              id="rgbBlueValue">1.00</span></div>
          <div class="format-hint" id="rgbHint">调整各通道亮度以改变色调，仅对 HDR PNG / HDR JPEG(ICC) 生效</div>
        </div>
      </div>

      <!-- 转换队列（队列 + 进度 + 状态） -->
      <div class="tab-panel" id="tabQueue" style="display:none">
        <div class="section">
          <div class="section-title">批量队列 <span id="batchCount" style="font-weight:normal;color:#5a7a9a;"></span></div>
          <div class="batch-actions">
            <button class="btn btn-secondary btn-sm" id="btnBatchClear">清空</button>
          </div>
          <label style="font-size:12px;">批量输出文件夹（留空则输出到各输入同目录）</label>
          <div class="path-row">
            <input id="batchOutputFolder" type="text" placeholder="例如 D:\hdr_out">
            <button class="path-btn" id="btnBrowseBatchOutputFolder">选择</button>
          </div>
          <div class="batch-list" id="batchList"></div>
        </div>

        <div class="section">
          <div class="section-title">转换进度</div>
          <div class="progress-wrap" id="batchProgress" style="display:none;margin-bottom:8px;">
            <div class="progress-bar">
              <div class="progress-fill" id="batchProgressFill"></div>
            </div>
            <div class="progress-label" id="batchProgressLabel">0%</div>
          </div>
          <div class="progress-wrap" id="progressWrap" style="display:none">
            <div class="progress-bar">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-label" id="progressLabel">0%</div>
          </div>
        </div>

        <div class="section">
          <div class="section-title">状态</div>
          <div id="status" class="status-box">就绪。选择或输入图片路径后开始转换。</div>
        </div>
      </div>

    </div>

    <div id="previewArea">
      <div class="preview-pane" id="sdrPane">
        <div class="preview-header">
          <span class="label">SDR <span class="badge-sdr">原图</span></span>
          <span class="info" id="sdrInfo">—</span>
        </div>
        <div class="preview-viewport" id="sdrViewport">
          <div class="placeholder">
            <div class="icon">🖼️</div>
            <div>SDR 原图</div>
            <div class="sub">选择输入图片后显示</div>
          </div>
        </div>
      </div>

      <div id="divider"></div>

      <div class="preview-pane" id="hdrPane">
        <div class="preview-header">
          <span class="label">HDR <span class="badge-hdr">ICC 增益</span></span>
          <span class="info" id="hdrInfo">—</span>
        </div>
        <div class="preview-viewport" id="hdrViewport">
          <div class="placeholder">
            <div class="icon">🌅</div>
            <div>HDR 预览</div>
            <div class="sub">转换完成后显示</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const api = window.electronAPI

    const inputPathEl = document.getElementById('inputPath')
    const outputPathEl = document.getElementById('outputPath')
    const statusEl = document.getElementById('status')
    const statusBar = document.getElementById('statusBar')
    const formatHint = document.getElementById('formatHint')
    const btnConvert = document.getElementById('btnConvert')
    const backendMethodEl = document.getElementById('backendMethod')
    const progressWrap = document.getElementById('progressWrap')
    const progressFill = document.getElementById('progressFill')
    const progressLabel = document.getElementById('progressLabel')
    const sdrViewport = document.getElementById('sdrViewport')
    const hdrViewport = document.getElementById('hdrViewport')
    const sdrInfo = document.getElementById('sdrInfo')
    const hdrInfo = document.getElementById('hdrInfo')
    const outputFormatSelect = document.getElementById('outputFormatSelect')
    const previewArea = document.getElementById('previewArea')
    const batchList = document.getElementById('batchList')
    const batchCount = document.getElementById('batchCount')
    const batchProgressWrap = document.getElementById('batchProgress')
    const batchProgressFill = document.getElementById('batchProgressFill')
    const batchProgressLabel = document.getElementById('batchProgressLabel')
    const qualitySection = document.getElementById('qualitySection')
    const jpgQuality = document.getElementById('jpgQuality')
    const batchOutputFolderEl = document.getElementById('batchOutputFolder')
    const hdrIntensityEl = document.getElementById('hdrIntensity')
    const hdrIntensityValueEl = document.getElementById('hdrIntensityValue')
    const rgbRedEl = document.getElementById('rgbRed')
    const rgbGreenEl = document.getElementById('rgbGreen')
    const rgbBlueEl = document.getElementById('rgbBlue')
    const rgbSectionEl = document.getElementById('rgbSection')

    // 输出格式 -> 扩展名映射
    const FORMAT_EXT = { png: 'png', jpg: 'jpg', jpg_icc: 'jpg' }

    // 简易路径拼接（渲染进程无 node path）
    function joinPath(dir, file) {
      return dir.replace(/[\\/]+$/, '') + '\\' + file
    }

    let currentInputPath = ''
    let currentOutputPath = ''
    let previewTimer = null
    let previewGeneration = 0

    // ---------- 批量队列状态 ----------
    // job: { id, inputPath, outputPath, status: queued|running|done|failed|cancelled, message }
    let batchQueue = []
    let batchRunning = false
    let cancelledInputs = new Set()  // 本次批量中已取消的输入路径（用于汇总）
    let jobSeq = 0

    function newJob(inputPath) {
      jobSeq += 1
      return {
        id: 'job_' + jobSeq + '_' + Date.now().toString(36),
        inputPath,
        outputPath: autoBatchOutputPath(inputPath),
        status: 'queued',
        message: ''
      }
    }

    // HDR 强度：按输出格式记忆（Ultra HDR 上限 6 / 默认 2.4；其余上限 2.0 / 默认 1.18）
    const HDR_INTENSITY_MAX = { jpg: 6.0, png: 2.0, jpg_icc: 2.0 }
    const HDR_INTENSITY_DEFAULTS = { jpg: 2.4, png: 1.18, jpg_icc: 1.18 }
    let hdrIntensityByFormat = { ...HDR_INTENSITY_DEFAULTS }
    let lastFormatForIntensity = null

    // 刷新并展示转换方式（转换前调用）
    async function refreshBackendStatus(force) {
      try {
        const info = await api.getBackendStatus()
        backendMethodEl.innerHTML = '<span class="dot"></span><span></span>'
        const textEl = backendMethodEl.querySelector('span:last-child')
        textEl.textContent = info && info.message ? info.message : '后端未就绪'
        backendMethodEl.className = 'backend-method ready'
      } catch (err) {
        backendMethodEl.innerHTML = '<span class="dot"></span><span>转换方式未知：' + (err.message || err) + '</span>'
        backendMethodEl.className = 'backend-method error'
      }
    }

    // 右上角简短状态（就绪/转换中/完成/失败…）
    const SHORT_STATUS = {
      ready: { text: '就绪', color: '#5a7a9a' },
      converting: { text: '转换中', color: '#4fc3f7' },
      batch: { text: '批量转换中', color: '#4fc3f7' },
      done: { text: '完成', color: '#3ddc84' },
      failed: { text: '失败', color: '#f14c4c' },
      cancelling: { text: '取消中', color: '#f5b342' }
    }
    function setShortStatus(key) {
      const s = SHORT_STATUS[key]
      if (!s) return
      statusBar.textContent = s.text
      statusBar.style.color = s.color
    }

    // 更新进度条（完整消息仅展示在状态框）
    function setProgress(value, message) {
      const pct = Math.max(0, Math.min(100, Math.round((value || 0) * 100)))
      progressFill.style.width = pct + '%'
      progressLabel.textContent = pct + '%'
    }

    // 更新状态框（完整消息；右上角短状态由 setShortStatus 单独控制）
    function setStatus(msg) {
      statusEl.textContent = msg
    }

    function getExtension(filePath) {
      const m = filePath.match(/\.([^.]+)$/)
      return m ? m[1].toLowerCase() : ''
    }

    // 获取最终输出格式：auto=跟随源文件，其他=手动选择
    function getEffectiveOutputFormat() {
      const sel = outputFormatSelect.value
      if (sel !== 'auto') return sel
      const ext = getExtension(currentInputPath)
      return (ext === 'png') ? 'png' : 'jpg'
    }

    // 自动生成输出路径
    function autoOutputPath(inputPath) {
      const fmt = getEffectiveOutputFormat()
      const outExt = FORMAT_EXT[fmt] || 'jpg'
      return inputPath.replace(/\.[^.]+$/, '') + '_hdr.' + outExt
    }

    function updateFormat() {
      const fmt = getEffectiveOutputFormat()
      const manual = outputFormatSelect.value !== 'auto'
      if (fmt === 'png') {
        formatHint.textContent = manual ? '🔵 手动选择 → HDR PNG（iCCP + BT.2020）' : '🔵 自动匹配 → HDR PNG（iCCP + BT.2020）'
      } else if (fmt === 'jpg_icc') {
        formatHint.textContent = '🟠 HDR JPEG（ICC 增益，BT.2020）'
      } else {
        formatHint.textContent = manual ? '🟠 手动选择 → Ultra HDR JPEG（增益图 + ICC）' : '🟠 自动匹配 → Ultra HDR JPEG（增益图 + ICC）'
      }
      // JPEG 质量滑块：jpg / jpg_icc 时显示，png 时隐藏
      qualitySection.style.display = (fmt === 'png') ? 'none' : 'block'
      // RGB 通道：仅 png / jpg_icc（带 ICC 增益）生效，Ultra HDR 时折叠隐藏
      rgbSectionEl.style.display = (fmt === 'jpg') ? 'none' : 'block'
      // HDR 强度：Ultra HDR 上限 6 / 默认 2.4，其余上限 2.0 / 默认 1.18（按格式记忆）
      if (fmt !== lastFormatForIntensity) {
        if (lastFormatForIntensity) hdrIntensityByFormat[lastFormatForIntensity] = parseFloat(hdrIntensityEl.value)
        hdrIntensityEl.max = String(HDR_INTENSITY_MAX[fmt] || 2.0)
        hdrIntensityEl.value = String(hdrIntensityByFormat[fmt])
        hdrIntensityValueEl.textContent = parseFloat(hdrIntensityEl.value).toFixed(2)
        lastFormatForIntensity = fmt
      }
      btnConvert.disabled = !currentInputPath
    }

    function onInputPathChange() {
      const val = inputPathEl.value.trim()
      if (!val) { currentInputPath = ''; updateFormat(); return }
      currentInputPath = val
      setShortStatus('ready')
      if (!outputPathEl.dataset.userSet) {
        currentOutputPath = autoOutputPath(val)
        outputPathEl.value = currentOutputPath
      }
      updateFormat()
      showSdrPreview(val)
      // 选择图片后立即触发一次预览
      triggerPreview()
    }

    inputPathEl.addEventListener('input', onInputPathChange)
    inputPathEl.addEventListener('paste', () => setTimeout(onInputPathChange, 50))

    outputPathEl.addEventListener('input', () => {
      currentOutputPath = outputPathEl.value.trim()
      outputPathEl.dataset.userSet = 'true'
    })

    // 输出格式切换时更新路径提示并刷新预览
    outputFormatSelect.addEventListener('change', () => {
      updateFormat()
      // 如果输出路径是自动生成的，跟随格式更新
      if (!outputPathEl.dataset.userSet && currentInputPath) {
        currentOutputPath = autoOutputPath(currentInputPath)
        outputPathEl.value = currentOutputPath
      }
      triggerPreview()
    })

    // 根据图片比例设置预览布局：
    //   比例 >= 4:3（宽幅/全景图）→ 上下排列
    //   比例 <  4:3（标准/竖幅图）→ 左右并排
    function setPreviewLayout(width, height) {
      const isWide = (width / height) >= (4 / 3)
      previewArea.className = isWide ? 'layout-vertical' : 'layout-horizontal'
    }

    // SDR 预览：通过 IPC 读取文件为 data URL
    function showSdrPreview(filePath) {
      if (!filePath) return
      api.readImagePreview(filePath).then((dataUrl) => {
        if (!dataUrl) {
          sdrViewport.innerHTML = '<div class="placeholder"><div class="icon">❌</div><div>加载失败</div></div>'
          sdrInfo.textContent = '加载失败'
          return
        }
        const img = new Image()
        img.onload = () => {
          sdrViewport.innerHTML = ''
          sdrViewport.appendChild(img)
          sdrInfo.textContent = img.naturalWidth + ' × ' + img.naturalHeight
          setPreviewLayout(img.naturalWidth, img.naturalHeight)
        }
        img.onerror = () => {
          sdrViewport.innerHTML = '<div class="placeholder"><div class="icon">❌</div><div>图片无法解码</div></div>'
          sdrInfo.textContent = '解码失败'
        }
        img.src = dataUrl
      })
    }

    // HDR 预览：通过 IPC 读取文件为 data URL
    function showHdrPreview(filePath) {
      if (!filePath) return
      api.readImagePreview(filePath).then((dataUrl) => {
        if (!dataUrl) {
          hdrViewport.innerHTML = '<div class="placeholder"><div class="icon">❌</div><div>加载失败</div></div>'
          hdrInfo.textContent = '加载失败'
          return
        }
        const img = new Image()
        img.onload = () => {
          hdrViewport.innerHTML = ''
          hdrViewport.appendChild(img)
          hdrInfo.textContent = img.naturalWidth + ' × ' + img.naturalHeight + ' · BT.2020'
        }
        img.onerror = () => {
          hdrViewport.innerHTML = '<div class="placeholder"><div class="icon">❌</div><div>HDR 图片无法解码</div></div>'
          hdrInfo.textContent = '解码失败'
        }
        img.src = dataUrl
      })
    }

    // 读取当前滑块参数
    function getCurrentSettings() {
      return {
        hdrIntensity: parseFloat(hdrIntensityEl.value),
        fineTuneBrightness: parseFloat(document.getElementById('fineTuneBrightness').value),
        gamma: parseFloat(document.getElementById('gamma').value),
        outputFormat: getEffectiveOutputFormat(),
        quality: parseFloat(jpgQuality.value) / 100,
        rgbAdjustment: {
          red: parseFloat(rgbRedEl.value),
          green: parseFloat(rgbGreenEl.value),
          blue: parseFloat(rgbBlueEl.value)
        }
      }
    }

    // 实时预览（拖拽滑块时实时更新，不闪烁）
    function triggerPreview() {
      if (!currentInputPath) return

      const gen = ++previewGeneration

      // 极小的防抖，避免连续拖拽时发太多请求
      if (previewTimer) clearTimeout(previewTimer)
      previewTimer = setTimeout(async () => {
        try {
          const result = await api.convertPreview({
            inputPath: currentInputPath,
            settings: getCurrentSettings()
          })
          // 只渲染最新一次的结果
          if (gen !== previewGeneration) return
          if (!result || !result.dataUrl) return

          const img = new Image()
          img.onload = () => {
            if (gen !== previewGeneration) return
            hdrViewport.innerHTML = ''
            hdrViewport.appendChild(img)
            hdrInfo.textContent = result.width + ' × ' + result.height + ' · 预览'
            setPreviewLayout(result.width, result.height)
          }
          img.src = result.dataUrl
        } catch (err) {
          // 静默忽略
        }
      }, 50) // 50ms 防抖，几乎无感
    }

    // 选择输入：支持单选（1 张 → 单个转换）与多选（多张 → 批量队列）
    async function chooseInput() {
      const files = await api.selectInputImages()
      if (!files || !files.length) return
      setShortStatus('ready')
      if (files.length === 1) {
        // 单张图片 → 单个转换模式，清空批量队列
        batchQueue = []
        renderBatch()
        inputPathEl.value = files[0]
        outputPathEl.dataset.userSet = ''
        onInputPathChange()
      } else {
        // 多张图片 → 替换为批量队列，并取第一张进行预览
        batchQueue = files.map((p) => newJob(p))
        renderBatch()
        setStatus(`已加入 ${files.length} 张图片到批量队列，取第一张预览`)
        setPreviewImage(files[0])
      }
    }

    // 将指定图片设为当前输入并触发 SDR / HDR 预览
    function setPreviewImage(filePath) {
      if (!filePath) return
      inputPathEl.value = filePath
      currentInputPath = filePath
      if (!outputPathEl.dataset.userSet) {
        currentOutputPath = autoOutputPath(filePath)
        outputPathEl.value = currentOutputPath
      }
      updateFormat()
      showSdrPreview(filePath)
      triggerPreview()
    }

    // 导入文件夹：把其中的图片追加到批量队列，并取第一张进行预览
    async function importFolder() {
      const r = await api.selectInputFolder()
      if (r && r.files && r.files.length) {
        setShortStatus('ready')
        const prev = new Set(batchQueue.map((j) => j.inputPath))
        const added = r.files.filter((p) => !prev.has(p))
        addBatchFiles(r.files)
        setStatus(`已从文件夹导入 ${r.files.length} 张图片，取第一张预览`)
        if (added.length) setPreviewImage(added[0])
        else setPreviewImage(r.files[0])
      } else if (r) {
        setStatus('该文件夹中没有图片文件')
      }
    }

    async function browseOutput() {
      const defaultPath = currentInputPath ? currentInputPath.replace(/\.[^.]+$/, '') : 'hdr_output'
      const result = await api.selectOutputPath(defaultPath)
      if (!result) return
      outputPathEl.value = result
      currentOutputPath = result
      outputPathEl.dataset.userSet = 'true'
    }

    // 开始转换：有批量队列则转批量，否则单个转换
    async function doConvert() {
      if (batchQueue.length > 0) {
        await startBatch()
        return
      }
      await doSingleConvert()
    }

    async function doSingleConvert() {
      if (!currentInputPath) { setStatus('请先选择或输入输入图片路径。'); return }

      let outPath = outputPathEl.value.trim()
      if (!outPath) {
        outPath = autoOutputPath(currentInputPath)
        outputPathEl.value = outPath
      }
      currentOutputPath = outPath

      const outputFormat = getEffectiveOutputFormat()

      const settings = getCurrentSettings()

      // 转换前告知转换方式
      await refreshBackendStatus(true)
      setStatus('正在转换…')
      setShortStatus('converting')
      switchTab('tabQueue')
      progressWrap.style.display = 'flex'
      setProgress(0, '正在转换…')
      btnConvert.disabled = true
      btnConvert.textContent = '⏳ 转换中'

      try {
        const result = await api.convertImage({
          inputPath: currentInputPath,
          outputPath: currentOutputPath,
          settings,
          backendPreference: 'auto'
        })
        setProgress(1, '完成')
        setStatus('✅ ' + result.message + '\n输出：' + result.outputPath)
        setShortStatus('done')
        showHdrPreview(result.outputPath)
      } catch (err) {
        setStatus('❌ 转换失败：' + (err.message || err))
        setShortStatus('failed')
      } finally {
        progressWrap.style.display = 'none'
        btnConvert.disabled = false
        btnConvert.textContent = '▶ 开始转换'
      }
    }

    api.onConversionProgress((progress) => {
      if (!progress) return
      // 预览转换也复用进度条
      progressWrap.style.display = 'flex'
      setProgress(progress.value, '⏳ ' + (progress.message || '处理中…'))
      statusEl.textContent = '⏳ ' + (progress.message || '处理中…')
      if (progress.active === false) {
        // 保持进度条显示，由调用方完成后隐藏
      }
    })

    // ---------- 批量转换 ----------
    function autoBatchOutputPath(inputPath) {
      // 输出格式：手动选择则跟随；auto 则按输入自身扩展名（png→png，其他→Ultra HDR jpg）
      const sel = outputFormatSelect.value
      let fmt
      if (sel !== 'auto') fmt = sel
      else fmt = (getExtension(inputPath) === 'png') ? 'png' : 'jpg'
      const outExt = FORMAT_EXT[fmt] || 'jpg'
      const base = inputPath.replace(/\.[^.]+$/, '') + '_hdr.' + outExt
      const outFolder = batchOutputFolderEl.value.trim()
      if (outFolder) return joinPath(outFolder, base.split(/[\\/]/).pop())
      return base
    }

    function addBatchFiles(filePaths) {
      for (const p of filePaths) {
        if (batchQueue.some((j) => j.inputPath === p)) continue // 去重
        batchQueue.push(newJob(p))
      }
      renderBatch()
    }

    // 批量输出文件夹变化：重新计算排队项的输出路径
    function onBatchOutputFolderChange() {
      batchQueue.forEach((j) => {
        if (j.status === 'queued') j.outputPath = autoBatchOutputPath(j.inputPath)
      })
      renderBatch()
    }

    function renderBatch() {
      batchCount.textContent = batchQueue.length ? `（${batchQueue.length} 个）` : ''
      batchList.innerHTML = ''
      const clearBtn = document.getElementById('btnBatchClear')
      if (batchQueue.length === 0) {
        const empty = document.createElement('div')
        empty.className = 'batch-item queued'
        empty.innerHTML = '<span class="b-name">队列为空（选择多张图片或导入文件夹后出现在此）</span><span class="b-status"></span>'
        batchList.appendChild(empty)
        clearBtn.disabled = true
        return
      }
      batchQueue.forEach((job, idx) => {
        const row = document.createElement('div')
        row.className = 'batch-item ' + job.status
        const name = job.inputPath.split(/[\\/]/).pop()
        const statusText = {
          queued: '排队中',
          running: '转换中…',
          done: '✅ 完成',
          failed: '❌ 失败',
          cancelled: '已取消'
        }[job.status] || job.status
        row.innerHTML =
          `<span class="b-name" title="${job.inputPath}">${idx + 1}. ${name}</span>` +
          `<span class="b-status">${statusText}</span>` +
          `<button class="b-remove" title="取消转换该图片" data-id="${job.id}">✕</button>`
        batchList.appendChild(row)
      })
      clearBtn.disabled = batchRunning
    }

    // 从队列移除/取消一个任务（运行中会通知后端取消）
    function removeBatchJob(id) {
      const job = batchQueue.find((j) => j.id === id)
      if (!job) return
      batchQueue = batchQueue.filter((j) => j.id !== id)
      if (batchRunning) {
        cancelledInputs.add(job.inputPath)
        api.batchCancelImages({ inputPaths: [job.inputPath] }).catch(() => { })
        setStatus(`正在取消：${job.inputPath.split(/[\\/]/).pop()}…`)
        setShortStatus('cancelling')
      }
      renderBatch()
    }

    function setBatchProgress(value, message) {
      const pct = Math.max(0, Math.min(100, Math.round((value || 0) * 100)))
      batchProgressFill.style.width = pct + '%'
      batchProgressLabel.textContent = pct + '%'
    }

    async function startBatch() {
      if (batchRunning || batchQueue.length === 0) return
      batchRunning = true
      cancelledInputs = new Set()
      btnConvert.disabled = true
      btnConvert.textContent = '⏳ 批量转换中'
      batchQueue.forEach((j) => { j.status = 'queued'; j.message = '' })
      // 快照提交的任务（含唯一 id，用于运行中被取消后按 id 回填结果）
      const snapshot = batchQueue.map((j) => {
        const fmt = (getExtension(j.outputPath) === 'png') ? 'png' : 'jpg'
        return { id: j.id, inputPath: j.inputPath, outputPath: j.outputPath, settings: { ...getCurrentSettings(), outputFormat: fmt } }
      })
      const jobs = snapshot.map(({ id, ...rest }) => rest)
      renderBatch()
      switchTab('tabQueue')
      batchProgressWrap.style.display = 'flex'
      setBatchProgress(0, '开始批量转换…')
      setStatus('批量转换中…（并发 ' + batchQueue.length + ' 个任务）')
      setShortStatus('batch')
      try {
        await refreshBackendStatus(true)
        const res = await api.batchConvertImages({ jobs })
        res.results.forEach((r, i) => {
          const jobId = snapshot[i] && snapshot[i].id
          const target = batchQueue.find((j) => j.id === jobId)
          if (!target) return // 该任务已被移除（取消）
          target.status = r.success ? 'done' : 'failed'
          target.message = r.message || ''
          if (r.outputPath) target.outputPath = r.outputPath
        })
        const doneCount = batchQueue.filter((j) => j.status === 'done').length
        const failCount = batchQueue.filter((j) => j.status === 'failed').length
        const cancelNote = cancelledInputs.size ? `，取消 ${cancelledInputs.size}` : ''
        setStatus(`✅ 批量转换完成：成功 ${doneCount}，失败 ${failCount}${cancelNote}`)
        setShortStatus('done')
        setBatchProgress(1, `批量完成：成功 ${doneCount}，失败 ${failCount}${cancelNote}`)
      } catch (err) {
        setStatus('❌ 批量转换失败：' + (err.message || err))
        setShortStatus('failed')
        batchQueue.forEach((j) => { if (j.status === 'queued') j.status = 'failed' })
        setBatchProgress(0, '批量转换失败')
      } finally {
        batchRunning = false
        renderBatch()
        btnConvert.disabled = false
        btnConvert.textContent = '▶ 开始转换'
        setTimeout(() => { batchProgressWrap.style.display = 'none' }, 2000)
      }
    }

    // 批量进度推送（主进程轮询 /batch/progress 转发）
    api.onBatchProgress((p) => {
      if (!p || !batchRunning) return
      // 逐项状态：后端 /batch/progress 返回 statuses（inputPath -> queued|running|done|failed|cancelled）
      if (p.statuses) {
        Object.entries(p.statuses).forEach(([inputPath, st]) => {
          const job = batchQueue.find((j) => j.inputPath === inputPath)
          if (job) job.status = st
        })
      }
      const total = p.total || batchQueue.length
      const done = (p.done || 0) + (p.failed || 0)
      batchProgressWrap.style.display = 'flex'
      setBatchProgress(total ? done / total : 0, '批量转换：' + (p.message || ''))
      statusEl.textContent = '⏳ ' + (p.message || '批量转换中…')
      renderBatch()
    })

    document.getElementById('btnChooseInput').addEventListener('click', chooseInput)
    document.getElementById('btnBrowseInput').addEventListener('click', chooseInput)
    document.getElementById('btnImportFolder').addEventListener('click', importFolder)
    document.getElementById('btnBrowseOutput').addEventListener('click', browseOutput)
    document.getElementById('btnConvert').addEventListener('click', doConvert)
    document.getElementById('btnBrowseBatchOutputFolder').addEventListener('click', async () => {
      const folder = await api.selectOutputFolder()
      if (folder) {
        batchOutputFolderEl.value = folder
        onBatchOutputFolderChange()
      }
    })
    batchOutputFolderEl.addEventListener('input', onBatchOutputFolderChange)
    document.getElementById('btnBatchClear').addEventListener('click', () => {
      if (batchRunning) return
      batchQueue = []
      cancelledInputs = new Set()
      renderBatch()
    })
    // 队列中每个项目的 ✕ 取消按钮
    batchList.addEventListener('click', (e) => {
      const btn = e.target.closest('.b-remove')
      if (!btn) return
      removeBatchJob(btn.dataset.id)
    })

    sdrViewport.addEventListener('dragover', (e) => e.preventDefault())
    sdrViewport.addEventListener('drop', (e) => {
      e.preventDefault()
      const f = e.dataTransfer.files
      if (f && f.length > 0 && f[0].path) {
        // 拖入单张图片 → 单个转换模式，清空批量队列
        batchQueue = []
        renderBatch()
        inputPathEl.value = f[0].path
        outputPathEl.dataset.userSet = ''
        onInputPathChange()
      }
    })

    function bindSlider(id, valueId) {
      const el = document.getElementById(id)
      const out = document.getElementById(valueId)
      el.addEventListener('input', () => {
        out.textContent = parseFloat(el.value).toFixed(2)
        triggerPreview()
      })
      out.textContent = parseFloat(el.value).toFixed(2)
    }
    bindSlider('fineTuneBrightness', 'fineTuneBrightnessValue')
    bindSlider('gamma', 'gammaValue')

    // HDR 强度：按当前输出格式记忆数值，实时预览（Ultra HDR 上限 6 / 默认 2.4）
    hdrIntensityEl.addEventListener('input', () => {
      hdrIntensityByFormat[getEffectiveOutputFormat()] = parseFloat(hdrIntensityEl.value)
      hdrIntensityValueEl.textContent = parseFloat(hdrIntensityEl.value).toFixed(2)
      triggerPreview()
    })

    // RGB 通道：实时预览（改变色调）
    function bindRgbSlider(id, valueId) {
      const el = document.getElementById(id)
      const out = document.getElementById(valueId)
      el.addEventListener('input', () => {
        out.textContent = parseFloat(el.value).toFixed(2)
        triggerPreview()
      })
      out.textContent = parseFloat(el.value).toFixed(2)
    }
    bindRgbSlider('rgbRed', 'rgbRedValue')
    bindRgbSlider('rgbGreen', 'rgbGreenValue')
    bindRgbSlider('rgbBlue', 'rgbBlueValue')

    // JPEG 质量滑块（百分比显示，实时生效）
    jpgQuality.addEventListener('input', () => {
      jpgQualityValue.textContent = jpgQuality.value + '%'
      triggerPreview()
    })
    jpgQualityValue.textContent = jpgQuality.value + '%'

    // 选项卡切换
    function switchTab(name) {
      document.querySelectorAll('.tab-btn').forEach((b) => {
        b.classList.toggle('active', b.dataset.tab === name)
      })
      document.querySelectorAll('.tab-panel').forEach((p) => {
        p.style.display = (p.id === name) ? '' : 'none'
      })
    }
    document.querySelectorAll('.tab-btn').forEach((b) => {
      b.addEventListener('click', () => switchTab(b.dataset.tab))
    })

    setStatus('就绪。选择或输入图片路径后开始转换。')
    setShortStatus('ready')
    // 页面加载后即探测转换方式
    refreshBackendStatus()
    // 按当前（初始）输出格式初始化 HDR 强度上限/默认值与 RGB 提示
    updateFormat()
  </script>
</body>

</html>

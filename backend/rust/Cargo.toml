[package]
name = "hdrconv"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust 版 HDR 转换 CLI：HDR PNG / HDR JPEG（ICC 增益）/ Ultra HDR JPEG。Kotlin 后端 1:1 移植"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
image = "0.25"
rayon = "1"
serde_json = "1"

# 可选：GPU 加速（调用 backend/cuda 的 C ABI DLL，见 src/gpu.rs）
libloading = { version = "0.8", optional = true }

[features]
default = []
gpu = ["dep:libloading"]

[dev-dependencies]
flate2 = "1"
image = "0.25"

[profile.release]
lto = "thin"
strip = true
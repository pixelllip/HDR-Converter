<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>重构 R3 · 媒体图库 — HDR Converter</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #121212;
      --bg-panel: #171717;
      --bg-raised: #1e1e1e;
      --bg-hover: #262626;
      --bg-input: #1b1b1b;
      --border: #2a2a2a;
      --border-strong: #3a3a3a;
      --text: #e8e8e8;
      --text-dim: #9d9d9d;
      --text-faint: #6e6e6e;
      --accent: #f0a33c;
      --accent-hover: #ffb95c;
      --accent-dim: rgba(240, 163, 60, 0.14);
      --ok: #4fd98a;
      --err: #ef5b5b;
      --font: "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
      --radius: 4px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: var(--font);
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      overflow: hidden;
    }

    .ic { width: 16px; height: 16px; flex-shrink: 0; }

    .app { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .library { flex: 1; display: flex; min-height: 0; }

    /* ---------- 工具栏 ---------- */
    #toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 0 14px;
      height: 46px;
      flex-shrink: 0;
    }
    .app-title { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; margin-left: 8px; }
    .spacer { flex: 1; }
    .sel-info { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
    .sel-info b { color: var(--accent); font-weight: 600; }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      border-radius: var(--radius);
      padding: 5px 12px;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }
    .btn:hover:not(:disabled) { background: var(--bg-hover); color: var(--text); border-color: var(--border-strong); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-sm { padding: 3px 10px; font-size: 12px; }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #181818; font-weight: 600; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); border-color: var(--accent-hover); color: #101010; }

    .backend-method {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--text-faint);
      padding: 4px 11px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg-raised);
      white-space: nowrap;
    }
    .backend-method .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }

    /* ---------- 左侧：缩略图网格 ---------- */
    .gridpane { flex: 1; display: flex; flex-direction: column; min-width: 0; }

    .grid-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg-panel);
      flex-shrink: 0;
    }
    .seg { display: flex; background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .seg-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 12px;
      font-family: inherit;
      padding: 4px 12px;
      cursor: pointer;
      transition: background 0.1s, color 0.1s;
    }
    .seg-btn:hover { background: var(--bg-hover); color: var(--text); }
    .seg-btn.active { background: var(--accent); color: #181818; font-weight: 600; }
    .seg-btn .ic { width: 13px; height: 13px; }

    .thumb-scroll { flex: 1; overflow-y: auto; padding: 12px; }

    .thumb-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }
    .thumb {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-panel);
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: border-color 0.12s;
    }
    .thumb:hover { border-color: var(--border-strong); }
    .thumb.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .thumb img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; }
    .thumb .t-name {
      padding: 5px 8px;
      font-size: 11px;
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .thumb .t-state {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(18, 18, 18, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ok);
    }
    .thumb .t-state .ic { width: 12px; height: 12px; }
    .thumb .t-state.failed { color: var(--err); }
    .thumb .t-check {
      position: absolute;
      top: 6px;
      left: 6px;
      width: 18px;
      height: 18px;
      border-radius: 3px;
      border: 1px solid var(--border-strong);
      background: rgba(18, 18, 18, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      color: transparent;
    }
    .thumb.selected .t-check { background: var(--accent); border-color: var(--accent); color: #181818; }
    .thumb .t-check .ic { width: 12px; height: 12px; }

    .thumb-list { display: flex; flex-direction: column; gap: 4px; }
    .tl-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--bg-panel);
      cursor: pointer;
      font-size: 12px;
      color: var(--text-dim);
    }
    .tl-row.selected { border-color: var(--accent); color: var(--text); }
    .tl-row img { width: 56px; height: 32px; object-fit: cover; border-radius: 2px; }
    .tl-row .tl-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tl-row .tl-check { width: 15px; height: 15px; border-radius: 3px; border: 1px solid var(--border-strong); display: flex; align-items: center; justify-content: center; color: transparent; }
    .tl-row.selected .tl-check { background: var(--accent); border-color: var(--accent); color: #181818; }
    .tl-row .tl-check .ic { width: 11px; height: 11px; }
    .tl-row .tl-state { font-size: 11px; width: 30px; text-align: right; }
    .tl-row .tl-state.ok { color: var(--ok); }
    .tl-row .tl-state.failed { color: var(--err); }

    .grid-empty { display: none; text-align: center; color: var(--text-faint); padding: 60px 20px; font-size: 13px; }
    .grid-empty.visible { display: block; }

    /* ---------- 右侧：检查器 ---------- */
    .inspector {
      width: 320px;
      min-width: 320px;
      display: flex;
      flex-direction: column;
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
    }
    .inspector-header {
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .inspector-viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0c0c0c;
      min-height: 160px;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .inspector-viewport img { max-width: 100%; max-height: 100%; object-fit: contain; transition: filter 0.1s; }
    .inspector-viewport .placeholder { color: var(--text-faint); font-size: 13px; text-align: center; padding: 20px; }

    .inspector-modes { display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .imode {
      flex: 1;
      background: var(--bg-raised);
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: var(--radius);
      padding: 4px 8px;
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.12s;
    }
    .imode.active { background: var(--accent); border-color: var(--accent); color: #181818; font-weight: 600; }

    .inspector-settings {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      overflow-y: auto;
      border-top: 1px solid var(--border);
    }
    .inspector-settings .sec-title { font-size: 12px; font-weight: 600; color: var(--text-dim); }
    label { font-size: 12px; color: var(--text-dim); }

    .range-row { display: grid; grid-template-columns: 1fr 52px; gap: 10px; align-items: center; }
    .range-row span { color: var(--text-dim); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 18px;
      background: transparent;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-runnable-track { height: 2px; background: var(--border-strong); border-radius: 1px; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%; background: var(--accent); border: none; }
    input[type="range"]::-moz-range-track { height: 2px; background: var(--border-strong); }
    input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); border: none; }

    select {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: var(--radius);
      padding: 6px 10px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }
    select:focus { border-color: var(--accent); }
    .format-hint { font-size: 11px; color: var(--text-faint); line-height: 1.5; }

    /* ---------- 底部状态栏 ---------- */
    #statusbar {
      display: flex;
      align-items: center;
      gap: 14px;
      height: 32px;
      padding: 0 12px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-faint);
      flex-shrink: 0;
    }
    .sb-progress { display: flex; align-items: center; gap: 8px; }
    .mini-bar { width: 140px; height: 4px; background: var(--bg-raised); border-radius: 2px; overflow: hidden; }
    .mini-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.15s; }
    .sb-msg { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ---------- 预览角标 ---------- */
    .preview-badge {
      position: fixed;
      right: 12px;
      bottom: 44px;
      z-index: 1000;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(22, 22, 22, 0.92);
      border: 1px solid var(--border-strong);
      color: var(--text-faint);
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
      font-family: var(--font);
    }
    .preview-badge strong { color: var(--accent); font-weight: 600; }
    .preview-badge a { color: var(--text-faint); text-decoration: none; }
    .preview-badge a:hover { color: var(--text); }
  </style>
</head>

<body>

  <div class="preview-badge" title="重构 3：媒体图库。左侧缩略图网格批量管理（可网格/列表切换），右侧检查器显示选中项并实时调参，底部批量进度。适合大量图片批量转换">
    <strong>重构 R3</strong> · 媒体图库
    <a href="index.html">← 返回重构对比</a>
  </div>

  <div class="app">
    <!-- 工具栏 -->
    <header id="toolbar">
      <button class="btn" id="btnImportFolder"><svg class="ic"><use href="#i-folderPlus" /></svg><span>导入文件夹</span></button>
      <button class="btn" id="btnAddFiles"><svg class="ic"><use href="#i-plus" /></svg><span>添加文件</span></button>
      <span class="sel-info">已选 <b id="selCount">0</b> / <span id="totalCount">0</span></span>
      <span class="spacer"></span>
      <div class="backend-method"><span class="dot"></span><span>演示模式</span></div>
      <button class="btn btn-primary" id="btnBatch" disabled><svg class="ic"><use href="#i-play" /></svg><span>开始批量转换</span></button>
    </header>

    <div class="library">
      <!-- 左：缩略图区 -->
      <section class="gridpane">
        <div class="grid-toolbar">
          <div class="seg" id="viewSeg">
            <button class="seg-btn active" data-v="grid"><svg class="ic"><use href="#i-grid" /></svg><span>网格</span></button>
            <button class="seg-btn" data-v="list"><svg class="ic"><use href="#i-list" /></svg><span>列表</span></button>
          </div>
          <span class="spacer"></span>
          <button class="btn btn-sm" id="btnSelAll">全选</button>
          <button class="btn btn-sm" id="btnSelNone">清空选择</button>
        </div>
        <div class="thumb-scroll">
          <div class="thumb-grid" id="thumbGrid"></div>
          <div class="thumb-list" id="thumbList" style="display:none"></div>
          <div class="grid-empty" id="gridEmpty">没有文件<br>点击"导入文件夹"或"添加文件"</div>
        </div>
      </section>

      <!-- 右：检查器 -->
      <aside class="inspector">
        <div class="inspector-header" id="inspTitle">未选择文件</div>
        <div class="inspector-viewport" id="inspViewport">
          <div class="placeholder">在左侧选择一个文件<br>此处显示大预览</div>
        </div>
        <div class="inspector-modes">
          <button class="imode active" data-m="sdr">SDR 原图</button>
          <button class="imode" data-m="hdr">HDR 预览</button>
        </div>
        <div class="inspector-settings">
          <div class="sec-title">参数（实时作用于预览）</div>
          <label>峰值亮度</label>
          <div class="range-row"><input id="r3Peak" type="range" min="400" max="1250" step="1" value="574"><span id="r3PeakValue">574 尼特</span></div>
          <label>伽马校正</label>
          <div class="range-row"><input id="r3Gamma" type="range" min="0.3" max="3" step="0.01" value="0.9"><span id="r3GammaValue">0.90</span></div>
          <label>红色通道</label>
          <div class="range-row"><input id="r3Red" type="range" min="0.3" max="3" step="0.01" value="0.96"><span id="r3RedValue">0.96</span></div>
          <label>绿色通道</label>
          <div class="range-row"><input id="r3Green" type="range" min="0.3" max="3" step="0.01" value="1"><span id="r3GreenValue">1.00</span></div>
          <label>蓝色通道</label>
          <div class="range-row"><input id="r3Blue" type="range" min="0.3" max="3" step="0.01" value="1"><span id="r3BlueValue">1.00</span></div>
          <label>输出格式</label>
          <select id="r3Format">
            <option>自动匹配（默认跟随源文件）</option>
            <option>HDR PNG（iCCP + BT.2020）</option>
            <option>HDR JPEG（ICC 增益，BT.2020）</option>
            <option>Ultra HDR JPEG（增益图 + ICC）</option>
          </select>
          <div class="format-hint">批量转换时以上参数应用于全部选中项</div>
        </div>
      </aside>
    </div>

    <!-- 底：批量进度 -->
    <footer id="statusbar">
      <span>批量进度 <b id="batchPos" style="color:var(--accent);font-weight:600;">0/0</b></span>
      <span class="sb-progress" id="sbProgress" style="display:none">
        <span class="mini-bar"><span class="mini-fill" id="miniFill"></span></span>
        <span id="miniPct">0%</span>
      </span>
      <span class="spacer"></span>
      <span class="sb-msg" id="sbMsg">就绪</span>
    </footer>
  </div>

  <script src="shared.js"></script>
  <script>
    (function () {
      var $ = $id

      /* ---------- 数据 ---------- */
      var items = []          // {name, seed, selected, done, failed}
      var seq = 0
      var view = 'grid'
      var inspMode = 'sdr'
      var selectedItem = null
      var batchRunning = false

      function seedNames(n) {
        var out = []
        for (var i = 0; i < n; i++) {
          out.push('IMG_' + String(1000 + seq + i) + (i % 3 === 2 ? '.png' : '.jpg'))
        }
        seq += n
        return out
      }

      function addItems(names) {
        names.forEach(function (n) {
          if (items.some(function (x) { return x.name === n })) return
          items.push({ name: n, seed: items.length, selected: false, done: false, failed: false })
        })
        render()
        updateCounts()
      }

      bind('btnImportFolder', function () { addItems(seedNames(8)) })
      bind('btnAddFiles', function () { addItems(seedNames(2)) })

      /* ---------- 渲染 ---------- */
      function render() {
        var grid = $('thumbGrid'), list = $('thumbList')
        grid.innerHTML = ''
        list.innerHTML = ''
        $('gridEmpty').classList.toggle('visible', items.length === 0)
        grid.style.display = view === 'grid' ? '' : 'none'
        list.style.display = view === 'list' ? '' : 'none'
        items.forEach(function (it) {
          if (view === 'grid') grid.appendChild(makeGridItem(it))
          else list.appendChild(makeListItem(it))
        })
      }

      function stateHtml(it) {
        if (it.failed) return '<span class="t-state failed"><svg class="ic"><use href="#i-x" /></svg></span>'
        if (it.done) return '<span class="t-state"><svg class="ic"><use href="#i-check" /></svg></span>'
        return ''
      }

      function makeGridItem(it) {
        var d = document.createElement('div')
        d.className = 'thumb' + (it.selected ? ' selected' : '')
        d.innerHTML =
          '<span class="t-check"><svg class="ic"><use href="#i-check" /></svg></span>' +
          '<img src="' + demoThumbDataUrl(it.seed) + '">' +
          '<div class="t-name">' + it.name + '</div>' +
          stateHtml(it)
        d.addEventListener('click', function () { toggleSelect(it) })
        return d
      }

      function makeListItem(it) {
        var d = document.createElement('div')
        d.className = 'tl-row' + (it.selected ? ' selected' : '')
        d.innerHTML =
          '<img src="' + demoThumbDataUrl(it.seed) + '">' +
          '<span class="tl-name">' + it.name + '</span>' +
          '<span class="tl-check"><svg class="ic"><use href="#i-check" /></svg></span>' +
          '<span class="tl-state ' + (it.failed ? 'failed' : (it.done ? 'ok' : '')) + '">' + (it.failed ? '失败' : (it.done ? '完成' : '')) + '</span>'
        d.addEventListener('click', function () { toggleSelect(it) })
        return d
      }

      function toggleSelect(it) {
        it.selected = !it.selected
        if (it.selected) selectedItem = it
        render()
        updateCounts()
        if (it.selected) updateInspector()
      }

      function updateCounts() {
        var n = items.filter(function (x) { return x.selected }).length
        setText('selCount', String(n))
        setText('totalCount', String(items.length))
        $('btnBatch').disabled = n === 0 || batchRunning
      }

      bind('btnSelAll', function () {
        items.forEach(function (x) { x.selected = true })
        if (items.length) selectedItem = items[0]
        render(); updateCounts()
        if (selectedItem) updateInspector()
      })
      bind('btnSelNone', function () {
        items.forEach(function (x) { x.selected = false })
        selectedItem = null
        render(); updateCounts()
        setText('inspTitle', '未选择文件')
        $('inspViewport').innerHTML = '<div class="placeholder">在左侧选择一个文件<br>此处显示大预览</div>'
      })

      document.querySelectorAll('#viewSeg .seg-btn').forEach(function (b) {
        b.addEventListener('click', function () {
          document.querySelectorAll('#viewSeg .seg-btn').forEach(function (x) { x.classList.toggle('active', x === b) })
          view = b.dataset.v
          render()
        })
      })

      /* ---------- 检查器 ---------- */
      function updateInspector() {
        if (!selectedItem) return
        setText('inspTitle', '已选：' + selectedItem.name)
        var img = document.createElement('img')
        img.src = inspMode === 'hdr' ? demoImageDataUrl(true) : demoImageDataUrl(false)
        img.onload = function () {
          var vp = $('inspViewport')
          vp.innerHTML = ''
          vp.appendChild(img)
          applyFilters()
        }
      }

      document.querySelectorAll('.imode').forEach(function (b) {
        b.addEventListener('click', function () {
          document.querySelectorAll('.imode').forEach(function (x) { x.classList.toggle('active', x === b) })
          inspMode = b.dataset.m
          if (selectedItem) updateInspector()
        })
      })

      function applyFilters() {
        var img = $('inspViewport').querySelector('img')
        if (!img) return
        var peak = parseInt($('r3Peak').value, 10)
        var gamma = parseFloat($('r3Gamma').value)
        var r = parseFloat($('r3Red').value), g = parseFloat($('r3Green').value), b = parseFloat($('r3Blue').value)
        var bright = inspMode === 'sdr' ? 0.75 : 0.75 + (peak / 1250) * 0.6
        var contrast = 1 + (gamma - 0.9) * 0.6   // 用 contrast 近似模拟伽马
        var saturate = (r + g + b) / 3
        img.style.filter = 'brightness(' + bright + ') contrast(' + contrast + ') saturate(' + saturate + ')'
      }
      ;['r3Peak', 'r3Gamma', 'r3Red', 'r3Green', 'r3Blue'].forEach(function (id) {
        $(id).addEventListener('input', applyFilters)
      })

      /* ---------- 批量转换 ---------- */
      bind('btnBatch', function () {
        if (batchRunning) return
        var targets = items.filter(function (x) { return x.selected })
        batchRunning = true
        $('btnBatch').disabled = true
        setText('batchPos', '0/' + targets.length)
        $('sbProgress').style.display = 'flex'
        setText('sbMsg', '批量转换开始…')

        var idx = 0
        var total = targets.length

        function next() {
          if (idx >= total) {
            batchRunning = false
            $('btnBatch').disabled = false
            var ok = items.filter(function (x) { return x.selected && x.done }).length
            var fail = items.filter(function (x) { return x.selected && x.failed }).length
            setText('sbMsg', '✅ 批量完成：成功 ' + ok + '，失败 ' + fail)
            setText('batchPos', ok + fail + '/' + total)
            $('miniFill').style.width = '100%'
            setText('miniPct', '100%')
            return
          }
          var it = targets[idx]
          it.done = false; it.failed = false
          render()
          // 模拟：每 7 个第 6 个失败
          setTimeout(function () {
            if ((items.indexOf(it) + 1) % 7 === 6) it.failed = true
            else it.done = true
            idx++
            setText('batchPos', idx + '/' + total)
            var pct = Math.round((idx / total) * 100)
            $('miniFill').style.width = pct + '%'
            setText('miniPct', pct + '%')
            setText('sbMsg', '正在转换：' + it.name + ' …')
            render()
            next()
          }, 180)
        }
        next()
      })

      render()
      updateCounts()
    })()
  </script>
</body>

</html>

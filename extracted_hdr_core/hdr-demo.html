<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HDR 核心代码演示</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      background: #0d0d1a;
      color: #e0e0e0;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* 工具栏 */
    #toolbar {
      display: flex; align-items: center;
      background: #16213e; padding: 6px 12px;
      border-bottom: 1px solid #2a2a4a;
      gap: 10px; flex-shrink: 0;
    }
    .tool-btn {
      background: transparent; border: 1px solid transparent;
      color: #e0e0e0; padding: 5px 10px; border-radius: 6px;
      cursor: pointer; font-size: 13px;
      transition: all 0.15s ease;
    }
    .tool-btn:hover { background: #1f3050; border-color: #2a2a4a; }
    .tool-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .file-name { font-size: 13px; color: #8899aa; flex: 1; text-align: center; }
    .zoom-level { font-size: 12px; color: #8899aa; min-width: 40px; text-align: center; }

    /* HDR 控制栏 */
    #hdrControls {
      display: flex; align-items: center; gap: 16px;
      background: #16213e; padding: 6px 14px;
      border-bottom: 1px solid #2a2a4a;
      flex-shrink: 0; flex-wrap: wrap;
    }
    #hdrControls.hidden { display: none; }
    .ctrl-group { display: flex; align-items: center; gap: 8px; }
    .ctrl-label { font-size: 12px; color: #8899aa; }
    .ctrl-slider { width: 100px; height: 4px; cursor: pointer; }
    .ctrl-value { font-size: 12px; color: #4fc3f7; min-width: 50px; }
    .ctrl-select {
      background: #0d0d1a; color: #e0e0e0;
      border: 1px solid #2a2a4a; border-radius: 4px;
      padding: 3px 8px; font-size: 12px; cursor: pointer;
    }

    /* 显示区域 */
    #displayArea {
      flex: 1; position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    #hdrCanvas { display: block; }

    /* 状态栏 */
    #statusBar {
      display: flex; justify-content: space-between;
      padding: 4px 14px; background: #16213e;
      border-top: 1px solid #2a2a4a;
      font-size: 12px; color: #8899aa;
      flex-shrink: 0;
    }
    #hdrIndicator { font-size: 12px; font-weight: 600; }
    #hdrIndicator.hdr { color: #4fc3f7; }
    #hdrIndicator.sdr { color: #888; }

    /* 测试图片列表 */
    #testImages {
      position: fixed; top: 50px; right: 12px;
      background: #1a1a2e; border: 1px solid #2a2a4a;
      border-radius: 6px; padding: 10px;
      width: 200px; z-index: 100;
      font-size: 12px; max-height: 70vh; overflow-y: auto;
    }
    #testImages h3 { margin-bottom: 8px; color: #4fc3f7; font-size: 13px; }
    .test-item {
      padding: 4px 8px; cursor: pointer; border-radius: 4px;
      margin-bottom: 2px;
    }
    .test-item:hover { background: #1f3050; }
    .test-item.active { background: #4fc3f7; color: #000; }
  </style>
</head>
<body>
  <!-- 工具栏 -->
  <div id="toolbar">
    <button id="btnLoadTest" class="tool-btn">📂 加载测试图</button>
    <input type="file" id="fileInput" accept=".hdr,.exr,.png,.jpg,.jpeg,.webp,.avif" style="display:none" />
    <span class="file-name" id="fileName">HDR 核心代码演示</span>
    <button id="btnZoomOut" class="tool-btn" title="缩小">🔍−</button>
    <span class="zoom-level" id="zoomLevel">100%</span>
    <button id="btnZoomIn" class="tool-btn" title="放大">🔍+</button>
    <button id="btnFit" class="tool-btn" title="适应窗口">⊞ 适应</button>
  </div>

  <!-- HDR 控制栏 -->
  <div id="hdrControls" class="hidden">
    <div class="ctrl-group">
      <span class="ctrl-label">🎚️ 曝光</span>
      <input type="range" class="ctrl-slider" id="exposureSlider" min="-5" max="5" step="0.1" value="0" />
      <span class="ctrl-value" id="exposureValue">0.0 EV</span>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">🔄 映射</span>
      <select class="ctrl-select" id="toneMapSelect">
        <option value="reinhard">Reinhard</option>
        <option value="aces">ACES</option>
        <option value="filmic">Filmic</option>
        <option value="none">无 (线性)</option>
      </select>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">☀️ 亮度</span>
      <input type="range" class="ctrl-slider" id="brightnessSlider" min="0.1" max="3" step="0.05" value="1" />
    </div>
  </div>

  <!-- 显示区域 -->
  <div id="displayArea">
    <canvas id="hdrCanvas"></canvas>
  </div>

  <!-- 测试面板 -->
  <div id="testImages">
    <h3>🧪 测试模式</h3>
    <div class="test-item" data-mode="rgbe">生成 RGBE 渐变</div>
    <div class="test-item" data-mode="hdr_sine">生成 HDR 正弦波</div>
    <div class="test-item" data-mode="load">📁 加载本地文件</div>
  </div>

  <!-- 状态栏 -->
  <div id="statusBar">
    <span id="hdrIndicator" class="sdr">⚫ SDR</span>
    <span id="statusMessage">就绪 — 点击测试模式生成 HDR 内容</span>
    <span id="statusInfo"></span>
  </div>

  <!-- 引入 HDR 核心库 -->
  <script src="hdr-core.js"></script>
  <script src="hdr-renderer.js"></script>
  <script src="demo.js"></script>
</body>
</html>
